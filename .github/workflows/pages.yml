# Arayüz kodu değişince GitHub Pages'i yeniden yayınlar (veri commit'leri crawl.yml içinde yayınlanır).
name: pages

on:
  push:
    paths:
      - 'public/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: GitHub Pages etkin mi?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" >/dev/null 2>&1 || gh api -X POST "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages etkin değil. Settings → Pages → Source: 'GitHub Actions' seçin. (Sadece Vercel kullanıyorsanız bu uyarıyı yok sayabilirsiniz.)"
          fi

      - name: Pages paketi
        if: steps.check.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Yayınla
        if: steps.check.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
